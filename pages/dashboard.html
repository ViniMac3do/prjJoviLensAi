<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOVI Lens AI — Dashboard</title>
  <link rel="icon" href="/assets/icons/favicon.ico">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/root.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body data-page="dashboard">

  <div data-include="nav"></div>

  <main class="jovi-dashboard">
    <div class="jovi-bg-blob jovi-bg-blob-1" aria-hidden="true"></div>
    <div class="jovi-bg-blob jovi-bg-blob-2" aria-hidden="true"></div>

    <div class="container-fluid px-4 px-lg-5 py-5 position-relative">

      <div class="d-flex flex-column align-items-center text-center gap-3 mb-4">
        <div>
          <h1 class="jovi-page-title">Nova análise</h1>
          <p class="jovi-page-subtitle">
            Dicas ajustadas para o nível <strong id="jovi-user-level">Iniciante</strong>.
          </p>
        </div>
        <button type="button" class="btn jovi-btn-outline" id="jovi-change-level-btn">
          Alterar nível
        </button>
      </div>

      <div class="jovi-dropzone" id="jovi-dropzone" tabindex="0" role="button"
           aria-label="Arraste uma foto ou clique para selecionar um arquivo">

        <input type="file" id="jovi-file-input" accept=".jpg,.jpeg,.png" hidden>

        <div class="jovi-dropzone-content" id="jovi-dropzone-empty">
          <div class="jovi-upload-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 16V4M12 4L7 9M12 4L17 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 16V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V16" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h2 class="jovi-dropzone-title">Arraste sua foto aqui</h2>
          <p class="jovi-dropzone-hint">JPG ou PNG, até 20 MB</p>
          <button type="button" class="btn jovi-btn-primary" id="jovi-select-file-btn">
            Selecionar arquivo
          </button>
        </div>

        <div class="jovi-dropzone-preview d-none" id="jovi-dropzone-preview">
          <img id="jovi-preview-image" alt="Pré-visualização da foto selecionada">
          <div class="jovi-preview-info">
            <span class="jovi-preview-filename" id="jovi-preview-filename"></span>
            <button type="button" class="jovi-preview-remove" id="jovi-preview-remove" aria-label="Remover arquivo">
              &times;
            </button>
          </div>
          <button type="button" class="btn jovi-btn-primary jovi-btn-analyze" id="jovi-analyze-btn">
            Iniciar análise
          </button>
        </div>

        <p class="jovi-dropzone-error d-none" id="jovi-dropzone-error"></p>
      </div>

      <section class="mt-5 text-center">
        <h3 class="jovi-section-title">Analisadas recentemente</h3>
        <div id="jovi-recent-empty" class="jovi-recent-empty">
          Suas fotos analisadas aparecerão aqui.
        </div>
        <div id="jovi-recent-grid" class="jovi-recent-grid d-none"></div>
      </section>

    </div>
  </main>

  <div class="modal fade" id="joviLevelModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content jovi-modal">
        <div class="modal-header border-0">
          <h5 class="modal-title">Qual seu nível de experiência?</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body">
          <button type="button" class="jovi-level-option" data-level="Iniciante">Estou conhecendo</button>
          <button type="button" class="jovi-level-option" data-level="Intermediário">Alguma experiência</button>
          <button type="button" class="jovi-level-option" data-level="Avançado">Sou experiente</button>
        </div>
      </div>
    </div>
  </div>

  <div data-include="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/include.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
