<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOVI Lens AI</title>
  <link rel="icon" href="/assets/icons/favicon.ico">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/root.css">
  <link rel="stylesheet" href="/css/index.css">
</head>
<body class="jovi-onboarding-body">

  <main class="jovi-onboarding">
    <div class="jovi-onboarding-card">

      <img src="/assets/jovi-lens-ai-logo.svg" alt="JOVI Lens AI" class="jovi-onboarding-logo">
      <p class="jovi-onboarding-tagline">O próximo nível da sua fotografia.</p>

      <h2 class="jovi-onboarding-question">Qual seu nível de experiência fotográfica?</h2>

      <div class="jovi-level-list" id="jovi-level-list">
        <button type="button" class="jovi-level-card jovi-level-iniciante" data-level="Iniciante">
          <span class="jovi-level-icon-badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 8H7L9 5H15L17 8H20C20.5523 8 21 8.44772 21 9V18C21 18.5523 20.5523 19 20 19H4C3.44772 19 3 18.5523 3 18V9C3 8.44772 3.44772 8 4 8Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="13.5" r="3.5" stroke="currentColor" stroke-width="2"/>
            </svg>
          </span>
          <span class="jovi-level-text">
            <span class="jovi-level-name">Estou conhecendo</span>
            <span class="jovi-level-desc">Iniciante</span>
          </span>
        </button>

        <button type="button" class="jovi-level-card jovi-level-intermediario" data-level="Intermediário">
          <span class="jovi-level-icon-badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="jovi-level-text">
            <span class="jovi-level-name">Alguma experiência</span>
            <span class="jovi-level-desc">Intermediário</span>
          </span>
        </button>

        <button type="button" class="jovi-level-card jovi-level-avancado" data-level="Avançado">
          <span class="jovi-level-icon-badge">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8 21H16M12 17V21M6 4H18V9C18 12.3137 15.3137 15 12 15C8.68629 15 6 12.3137 6 9V4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6 6H4C3.44772 6 3 6.44772 3 7V8C3 9.65685 4.34315 11 6 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M18 6H20C20.5523 6 21 6.44772 21 7V8C21 9.65685 19.6569 11 18 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="jovi-level-text">
            <span class="jovi-level-name">Sou experiente</span>
            <span class="jovi-level-desc">Avançado</span>
          </span>
        </button>
      </div>

      <button type="button" class="jovi-btn-continuar" id="jovi-btn-continuar" disabled>
        Continuar
      </button>

      <p class="jovi-onboarding-footnote">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="jovi-footnote-icon">
          <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="2"/>
          <path d="M8 11V7a4 4 0 118 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Seus dados estão seguros. Privacidade garantida.
      </p>

    </div>
  </main>

  <script src="/js/index.js"></script>
</body>
</html>
